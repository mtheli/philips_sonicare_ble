name: ESPHome build

on:
  push:
    paths: ["esphome/**", ".github/workflows/esphome.yml"]
  pull_request:
    paths: ["esphome/**", ".github/workflows/esphome.yml"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "beta" installs the newest pre-release, so breaking changes show up
        # before they reach users (e.g. #50).
        esphome: ["2026.1.0", "2026.7.1", "latest", "beta"]
        board: ["esp32dev", "esp32-s3-devkitc-1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: |
          if [ "${{ matrix.esphome }}" = "latest" ]; then
            pip install esphome
          elif [ "${{ matrix.esphome }}" = "beta" ]; then
            pip install --pre esphome
          else
            pip install "esphome==${{ matrix.esphome }}"
          fi
          esphome version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esphome/tests/.esphome
          # The cached build dir pins absolute tool paths (ninja lives in the
          # runner's Python toolcache), so a runner image with a newer Python
          # patch release must not reuse it.
          key: esphome-${{ steps.py.outputs.python-version }}-${{ matrix.esphome }}-${{ matrix.board }}-${{ hashFiles('esphome/components/**') }}
          restore-keys: esphome-${{ steps.py.outputs.python-version }}-${{ matrix.esphome }}-${{ matrix.board }}-
      - name: Compile
        working-directory: esphome/tests
        run: |
          set -o pipefail
          esphome -s board ${{ matrix.board }} compile ci-bridge.yaml 2>&1 | tee build.log
      - name: No compiler warnings from the component
        working-directory: esphome/tests
        run: |
          if grep -E "philips_sonicare/[^ ]+\.(cpp|h):[0-9]+:[0-9]+: warning" build.log; then
            echo "::error::Compiler warnings in philips_sonicare (see above)"
            exit 1
          fi
