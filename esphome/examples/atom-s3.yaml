# Philips Sonicare bridge for the M5Stack AtomS3 / AtomS3R / AtomS3 Lite
# (ESP32-S3), one toothbrush. Same setup as atom-lite.yaml; the differences
# are the board and the build option under `esphome: build_flags`.
esphome:
  name: atom-s3
  friendly_name: "Atom S3 BLE Bridge"
  # Required on every chip but the original ESP32 for brushes with a rotating
  # address (Series 7100, Sonicare For Kids HX6600): without it the bridge
  # pairs, but loses the brush after the first session. Harmless for brushes
  # with a fixed address. See KNOWN_ISSUES.md, "Brushes with a rotating
  # address stop reconnecting on newer ESP32 chips".
  build_flags:
    - -DCONFIG_BT_BLE_RPA_SUPPORTED=0

# ESP-IDF is required (not Arduino) because Bluedroid's notification limit
# is only configurable via sdkconfig.
esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf
    # ESPHome 2026.10.0 defaults to ESP-IDF 5.5.6, which drops the pairing
    # after the first disconnect (see KNOWN_ISSUES.md, "ESP bridge loses
    # pairings with ESP-IDF 5.5.6"). ESPHome warns that this is not the
    # recommended version; that is expected. On ESPHome versions that already
    # ship 5.5.5 the line changes nothing. Keep it until KNOWN_ISSUES.md says
    # the issue is fixed.
    version: 5.5.5
    sdkconfig_options:
      CONFIG_BT_GATTC_MAX_CACHE_CHAR: "80"
      CONFIG_BT_GATTC_NOTIF_REG_MAX: "20"

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Atom-S3-Fallback"
    password: !secret fallback_password

captive_portal:

# --- BLE ---

esp32_ble:
  io_capability: none
  max_notifications: 20

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 211ms
    window: 120ms

# --- Philips Sonicare Component (Auto-Discovery — no MAC required) ---
#
# To pair:
#   1. Flash this firmware
#   2. In Home Assistant, add the Philips Sonicare integration → ESP32 Bridge
#   3. Walk through "Pair toothbrush with bridge" — switch on the brush when
#      prompted, the ESP scans, bonds, and finishes setup.

external_components:
  - source:
      type: git
      url: https://github.com/mtheli/philips_sonicare_ble
      ref: master
      path: esphome/components
    components: [philips_sonicare]
    refresh: 0s

philips_sonicare:
  - id: philips_sonicare_ble
    # Optional: pre-fill the HA setup form (one-shot defaults).
    # friendly_name: "My Sonicare"
    # area: "Bathroom"
    on_connect:
      then:
        - logger.log: "Connected to Sonicare"
    on_disconnect:
      then:
        - logger.log: "Disconnected from Sonicare"

# --- Hardware: M5Stack AtomS3 family ---

# Front button (GPIO41) — the same on AtomS3, AtomS3R and AtomS3 Lite.
binary_sensor:
  - platform: gpio
    id: atom_button
    name: "Button"
    pin:
      number: GPIO41
      inverted: true

button:
  - platform: restart
    name: "Restart"

# --- Bluetooth Proxy (optional) ---
# Uncomment to relay BLE for other devices through this ESP.
#
# bluetooth_proxy:
#   active: true
