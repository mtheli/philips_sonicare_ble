esphome:
  name: esp32-ble-bridge
  friendly_name: "ESP32 BLE Bridge"
  #  platformio_options:
  #    build_flags:
  #      - -ULV_USE_OBSERVER    
  #      - -DLV_USE_OBSERVER=1
  #      - -DLV_USE_SYSMON=1
  #      - -DLV_USE_PERF_MONITOR=1 # Active le widget FPS et CPU
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: backlight
            brightness: 100%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    #Bluetooth bug in 5.5.6->Forcing 5.5.5 until ESPHome released with the fix
    version: 5.5.5
    sdkconfig_options:
      CONFIG_BT_GATTC_MAX_CACHE_CHAR: "80"
      CONFIG_BT_GATTC_NOTIF_REG_MAX: "20"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESP32-BLE-Bridge-Fallback"
    password: !secret fallback_password

captive_portal:

# -----------------------------------------------------------------------------
# BLE configuration
# -----------------------------------------------------------------------------
esp32_ble:
  io_capability: none
  max_notifications: 20

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 211ms
    window: 120ms

# -----------------------------------------------------------------------------
# Philips Sonicare bridge
# -----------------------------------------------------------------------------
# The component scans for the Sonicare service UUID, bonds with the brush
# you put into pair-mode via the HA setup flow, and stores the bond identity
# in NVS. After bonding, the controller resolves rotating BLE addresses
# (RPA) back to the same brush automatically — no MAC pinning needed.
#
# To pair:
#   1. Flash this firmware
#   2. In Home Assistant, add the Philips Sonicare integration → ESP32 Bridge
#   3. Walk through "Pair toothbrush with bridge" — switch on the brush when
#      prompted, the ESP scans, bonds, and finishes setup.
#
# BLE bonding is handled automatically. Models that require bonding (e.g.
# Prestige 9900, ExpertClean, HX991M) are paired via SMP after service
# discovery; models with open GATT (e.g. DiamondClean) work without pairing.
external_components:
  #Sonicare
  - source:
      type: git
      url: https://github.com/mtheli/philips_sonicare_ble
      ref: master
      path: esphome/components
    components: [philips_sonicare]
    refresh: 0s # always fetch latest code on build
  #Screen diver. Since it's not in main branch yet, use pr for activating model : ES3C35P
  - source: github://pr#19011
    components: [mipi_spi]
    refresh: 1h

philips_sonicare:
  - id: philips_sonicare_ble
    # Optional: pre-fill the HA setup form. `friendly_name` becomes the
    # default device name; `area` auto-assigns the brush to an HA area on
    # first install. One-shot defaults — edit names in HA after that.
    # friendly_name: "My Sonicare"
    # area: "Bathroom"
    on_connect:
      then:
        - logger.log: "Connected to Sonicare"
    on_disconnect:
      then:
        - logger.log: "Disconnected from Sonicare"

# Optional: Bluetooth proxy
# Uncomment to relay BLE for other devices through this ESP. On
# ESPHome < 2026.7.1 (ESP-IDF < 5.5.5) this additionally requires the
# bluedroid_null_fix.py patch (uncomment platformio_options at the top of
# this file) to dodge ESP-IDF bug https://github.com/esphome/esphome/issues/15783
# — without the patch, every GATT service discovery crashes the chip and the
# component refuses to build. From ESPHome 2026.7.1 the fix ships upstream.
bluetooth_proxy:
  active: true

# -----------------------------------------------------------------------------
# Hardware and display
# https://github.com/jlmeredith/ES3C35P/tree/main
# https://github.com/esphome/esphome/pull/19011
# https://www.lcdwiki.com/3.5inch_ESP32-S3_Display#Product_Specifications
# https://docs.freenove.com/projects/fnk0104/en/latest/fnk0104/codes/MAIN/Freenove_ESP32S3_Display.html
# -----------------------------------------------------------------------------
spi:
  - id: lcd_bus
    type: quad
    clk_pin: GPIO12
    data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]

i2c:
  - id: bus_a
    sda: GPIO38
    scl: GPIO39
    frequency: 400kHz

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO41 # active HIGH
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_OFF #On/Off backlight is on Brush status or touch screen
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "LED RGB Carte"
    pin: GPIO40
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF

display:
  - platform: mipi_spi
    id: lcd
    spi_id: lcd_bus
    model: ES3C35P # Profile from PR #19011
    bus_mode: quad
    cs_pin: GPIO10
    data_rate: 40MHz # Can do 80Mhz if needed, but 40Mhz is more stable and sufficient for now

touchscreen:
  - platform: st7123
    id: touch
    i2c_id: bus_a
    address: 0x55
    reset_pin: GPIO48
    display: lcd
    on_touch:
      then:
        - if:
            condition:
              script.is_running: temporisation_ecran
            then:
              - logger.log: "Touch direct : Écran allumé -> Extinction demandée."
              - script.stop: temporisation_ecran
              - light.turn_off: backlight
            else:
              - if:
                  condition:
                    light.is_off: backlight
                  then:
                    - logger.log: "Touch direct : Écran éteint -> Allumage immédiat."
                    - light.turn_on:
                        id: backlight
                        brightness: 100%
                    - script.execute: temporisation_ecran

# -----------------------------------------------------------------------------
# Audio configuration
# -----------------------------------------------------------------------------
i2s_audio:
  - id: i2s_bus
    i2s_bclk_pin: GPIO18 
    i2s_lrclk_pin: GPIO21
    i2s_mclk_pin: GPIO17 
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: board_speaker_hardware
    dac_type: external
    i2s_dout_pin: GPIO15
    i2s_mode: primary
    channel: mono

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: board_speaker_hardware
    source_speakers:
      - id: announcement_spk_input
      - id: media_spk_input
#Untested MIC. Potential conflict with speaker on i2S bus?
microphone:
  - platform: i2s_audio
    id: board_microphone_hardware
    i2s_din_pin: GPIO16 
    adc_type: external
    pdm: false

media_player:
  - platform: speaker
    name: "Haut-Parleur ES3C35P"
    id: board_media_player
    volume_initial: 100%
    announcement_pipeline:
      speaker: announcement_spk_input
      format: MP3
    media_pipeline:
      speaker: media_spk_input
      format: MP3

switch:
  - platform: gpio
    pin:
      number: GPIO1
      inverted: true
    id: amp_enable
    name: "Amplificateur Audio"
    restore_mode: ALWAYS_ON

voice_assistant:
  id: assistant_vocal_local
  microphone: board_microphone_hardware
  speaker: board_speaker_hardware


