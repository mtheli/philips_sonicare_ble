# Brush values from Home Assistant. HA sends the raw states of the
# integration (lowercase, untranslated, e.g. `brushing`, `gum_health`,
# `medium`), or `unavailable` / `unknown`. Numbers arrive as NaN while the
# entity is unavailable.
sensor:
  - platform: homeassistant
    id: brush_time
    entity_id: sensor.${brush}_brushing_time
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_time
          text: !lambda |-
            if (std::isnan(x) || x < 0) return std::string("--:--");
            const int seconds = static_cast<int>(x);
            return str_sprintf("%d:%02d", seconds / 60, seconds % 60);
      - lvgl.arc.update:
          id: arc_session
          value: !lambda |-
            return std::isnan(x) ? 0 : static_cast<int>(std::clamp(x, 0.0f, 120.0f));

  - platform: homeassistant
    id: brush_battery
    entity_id: sensor.${brush}_battery
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_battery
          text: !lambda |-
            return std::isnan(x) ? std::string("--%") : str_sprintf("%.0f%%", x);
      - lvgl.bar.update:
          id: bar_battery
          value: !lambda |-
            return std::isnan(x) ? 0 : static_cast<int>(std::clamp(x, 0.0f, 100.0f));
      # Red at 0 %, green at 100 %
      - lambda: |-
          if (std::isnan(x)) {
            lv_obj_set_style_bg_color(id(bar_battery), lv_color_hex(0x666666), LV_PART_INDICATOR);
            return;
          }
          const float ratio = std::clamp(x / 100.0f, 0.0f, 1.0f);
          lv_obj_set_style_bg_color(id(bar_battery), lv_color_make(static_cast<uint8_t>(255 * (1 - ratio)), static_cast<uint8_t>(255 * ratio), 0), LV_PART_INDICATOR);

  - platform: homeassistant
    id: brush_head_wear
    entity_id: sensor.${brush}_brush_head_wear
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_wear
          text: !lambda |-
            return std::isnan(x) ? std::string("--%") : str_sprintf("%.0f%%", x);
      - lvgl.bar.update:
          id: bar_wear
          value: !lambda |-
            return std::isnan(x) ? 0 : static_cast<int>(std::clamp(x, 0.0f, 100.0f));
      # Green at 0 %, red at 100 %
      - lambda: |-
          if (std::isnan(x)) {
            lv_obj_set_style_bg_color(id(bar_wear), lv_color_hex(0x666666), LV_PART_INDICATOR);
            return;
          }
          const float ratio = std::clamp(x / 100.0f, 0.0f, 1.0f);
          lv_obj_set_style_bg_color(id(bar_wear), lv_color_make(static_cast<uint8_t>(255 * ratio), static_cast<uint8_t>(255 * (1 - ratio)), 0), LV_PART_INDICATOR);

  - platform: homeassistant
    id: brush_pressure
    entity_id: sensor.${brush}_pressure
    internal: true
    on_value:
      - lvgl.bar.update:
          id: bar_pressure
          value: !lambda |-
            return std::isnan(x) ? 0 : static_cast<int>(std::clamp(x, 0.0f, 300.0f));
      - lvgl.bar.update:
          id: bar_pressure_alert
          value: !lambda |-
            return std::isnan(x) ? 0 : static_cast<int>(std::clamp(x, 0.0f, 300.0f));
      # Green at 0 g, red at 300 g
      - lambda: |-
          if (std::isnan(x)) {
            lv_obj_set_style_bg_color(id(bar_pressure), lv_color_hex(0x666666), LV_PART_INDICATOR);
            return;
          }
          const float ratio = std::clamp(x / 300.0f, 0.0f, 1.0f);
          lv_obj_set_style_bg_color(id(bar_pressure), lv_color_make(static_cast<uint8_t>(255 * ratio), static_cast<uint8_t>(255 * (1 - ratio)), 0), LV_PART_INDICATOR);
      - lvgl.label.update:
          id: label_pressure
          text: !lambda |-
            return std::isnan(x) ? std::string("-- g") : str_sprintf("%.0f g", x);

text_sensor:
  - platform: homeassistant
    id: brush_activity
    entity_id: sensor.${brush}_activity
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_status
          text: !lambda |-
            static const char *const names[][2] = {
              {"initializing", "${txt_initializing}"},
              {"off", "${txt_off}"},
              {"standby", "${txt_standby}"},
              {"brushing", "${txt_brushing}"},
              {"paused", "${txt_paused}"},
              {"charging", "${txt_charging}"},
            };
            for (const auto &n : names) {
              if (x == n[0]) return std::string(n[1]);
            }
            return std::string("${txt_offline}");
      # Amber while starting up, grey when off or offline, green otherwise
      - lambda: |-
          lv_color_t color = lv_color_hex(0x22C55E);
          if (x == "initializing") color = lv_color_hex(0xF59E0B);
          else if (x == "off" || x == "unavailable" || x == "unknown" || x.empty()) color = lv_color_hex(0x9AA3AF);
          lv_obj_set_style_text_color(id(label_status), color, LV_PART_MAIN);
      # Screen on while the brush is active, off 10 s after it stops
      - if:
          condition:
            lambda: |-
              return x == "off" || x == "initializing" || x == "unavailable" || x == "unknown" || x.empty();
          then:
            - script.execute: screen_timeout
          else:
            - script.stop: screen_timeout
            - light.turn_on:
                id: backlight
                brightness: 100%

  - platform: homeassistant
    id: brush_mode
    entity_id: sensor.${brush}_brushing_mode
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_mode
          text: !lambda |-
            static const char *const names[][2] = {
              {"clean", "Clean"},
              {"white", "White"},
              {"white_plus", "White+"},
              {"gum_care", "Gum Care"},
              {"gum_health", "Gum Health"},
              {"deep_clean", "Deep Clean"},
              {"deep_clean_plus", "Deep Clean+"},
              {"sensitive", "Sensitive"},
              {"tongue_care", "Tongue Care"},
            };
            for (const auto &n : names) {
              if (x == n[0]) return std::string(n[1]);
            }
            return std::string("--");

  - platform: homeassistant
    id: brush_head_type
    entity_id: sensor.${brush}_brush_head_type
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_head_type
          text: !lambda |-
            static const char *const names[][2] = {
              {"adaptive_clean", "Clean (C)"},
              {"adaptive_white", "White (W)"},
              {"adaptive_gums", "Gums (G)"},
              {"tongue_clean", "TongueCare+"},
              {"premium_all_in_one", "All-in-One (A)"},
              {"sensitive", "Sensitive (S)"},
              {"non_rfid", "Non-RFID"},
            };
            for (const auto &n : names) {
              if (x == n[0]) return std::string(n[1]);
            }
            return std::string("--");

  - platform: homeassistant
    id: brush_intensity
    entity_id: sensor.${brush}_intensity
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_intensity
          text: !lambda |-
            if (x == "low") return std::string("${txt_low}");
            if (x == "medium") return std::string("${txt_medium}");
            if (x == "high") return std::string("${txt_high}");
            return std::string("--");
      # Light up one, two or three bars
      - lambda: |-
          const int level = x == "low" ? 1 : x == "medium" ? 2 : x == "high" ? 3 : 0;
          const auto inactive = lv_color_hex(0x303741);
          const auto active = lv_color_hex(0x4F8CFF);
          lv_obj_set_style_bg_color(id(bar_intensity_1), level >= 1 ? active : inactive, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(bar_intensity_2), level >= 2 ? active : inactive, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(bar_intensity_3), level >= 3 ? active : inactive, LV_PART_MAIN);

# The pressure bar turns red while the pressure alert is on
binary_sensor:
  - platform: homeassistant
    id: brush_pressure_alert
    entity_id: binary_sensor.${brush}_pressure_alert
    internal: true
    on_press:
      - lvgl.widget.hide: bar_pressure
      - lvgl.widget.show: bar_pressure_alert
    on_release:
      - lvgl.widget.show: bar_pressure
      - lvgl.widget.hide: bar_pressure_alert

