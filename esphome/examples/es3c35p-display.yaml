# -----------------------------------------------------------------------------
# Home Assistant sensors
# -----------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: brosse_temps
    entity_id: sensor.sonicare_hx960x_6d3a_brushing_time
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_temps
          text: !lambda |-
            if (!(x == x) || x < 0) return std::string("--:--");
            const int seconds = static_cast<int>(x);
            return str_sprintf("%d:%02d", seconds / 60, seconds % 60);
      - lvgl.arc.update:
          id: arc_session
          value: !lambda |-
            if (!(x == x) || x < 0) return 0;
            if (x > 120) return 120;
            return static_cast<int>(x);

  - platform: homeassistant
    id: brosse_batterie
    entity_id: sensor.sonicare_hx960x_6d3a_battery
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_batterie
          text: !lambda |-
            if (!(x == x)) return std::string("--%");
            return str_sprintf("%.0f%%", x);
      - lvgl.bar.update:
          id: barre_batterie
          value: !lambda |-
            if (!(x == x) || x < 0) return 0;
            if (x > 100) return 100;
            return static_cast<int>(x);
      - lambda: |-
          if (!(x == x)) {
            lv_obj_set_style_bg_color(id(barre_batterie), lv_color_hex(0x666666), LV_PART_INDICATOR);
            return;
          }
          const float ratio = x <= 0 ? 0.0f : (x >= 100 ? 1.0f : x / 100.0f);
          const uint8_t red = static_cast<uint8_t>(255.0f * (1.0f - ratio));
          const uint8_t green = static_cast<uint8_t>(255.0f * ratio);
          lv_obj_set_style_bg_color(id(barre_batterie), lv_color_make(red, green, 0), LV_PART_INDICATOR);

  - platform: homeassistant
    id: brosse_usure
    entity_id: sensor.sonicare_hx960x_6d3a_brush_head_wear
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_usure
          text: !lambda |-
            if (!(x == x)) return std::string("--%");
            return str_sprintf("%.0f%%", x);
      - lvgl.bar.update:
          id: barre_usure
          value: !lambda |-
            if (!(x == x) || x < 0) return 0;
            if (x > 100) return 100;
            return static_cast<int>(x);
      - lambda: |-
          if (!(x == x)) {
            lv_obj_set_style_bg_color(id(barre_usure), lv_color_hex(0x666666), LV_PART_INDICATOR);
            return;
          }
          const float ratio = x <= 0 ? 0.0f : (x >= 100 ? 1.0f : x / 100.0f);
          const uint8_t red = static_cast<uint8_t>(255.0f * ratio);
          const uint8_t green = static_cast<uint8_t>(255.0f * (1.0f - ratio));
          lv_obj_set_style_bg_color(id(barre_usure), lv_color_make(red, green, 0), LV_PART_INDICATOR);

  - platform: homeassistant
    id: brosse_pression
    entity_id: sensor.sonicare_hx960x_6d3a_pressure
    internal: true
    on_value:
      - lvgl.bar.update:
          id: barre_pression_blanche
          value: !lambda |-
            if (!(x == x) || x < 0) return 0;
            if (x > 300) return 300;
            return static_cast<int>(x);
      - lvgl.bar.update:
          id: barre_pression_rouge
          value: !lambda |-
            if (!(x == x) || x < 0) return 0;
            if (x > 300) return 300;
            return static_cast<int>(x);
      - lambda: |-
          if (!(x == x)) {
            lv_obj_set_style_bg_color(id(barre_pression_blanche), lv_color_hex(0x666666), LV_PART_INDICATOR);
            return;
          }
          const float ratio = x <= 0 ? 0.0f : (x >= 300 ? 1.0f : x / 300.0f);
          const uint8_t red = static_cast<uint8_t>(255.0f * ratio);
          const uint8_t green = static_cast<uint8_t>(255.0f * (1.0f - ratio));
          lv_obj_set_style_bg_color(id(barre_pression_blanche), lv_color_make(red, green, 0), LV_PART_INDICATOR);
      - lvgl.label.update:
          id: label_pression_valeur
          text: !lambda |-
            if (!(x == x)) return std::string("-- g");
            return str_sprintf("%.0f g", x);

script:
  - id: temporisation_ecran
    mode: restart
    then:
      - delay: 10s
      - logger.log: "Automatisme : Fin des 10s post-brossage. Extinction de l'écran."
      - light.turn_off: backlight

text_sensor:
  - platform: homeassistant
    id: brosse_statut
    entity_id: sensor.sonicare_hx960x_6d3a_activity
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_statut_off
          text: !lambda |-
            std::string s = x;
            std::transform(s.begin(), s.end(), s.begin(), ::tolower);
            if (s.empty() || s == "unknown" || s == "unavailable" || s == "none" || s.rfind("initializ", 0) == 0 || s.rfind("initialis", 0) == 0) return std::string("INITIALISING...");
            if (s == "off") return std::string("OFF");
            return x;
      - lambda: |-
          std::string s = x;
          std::transform(s.begin(), s.end(), s.begin(), ::tolower);
          const bool initializing = s.empty() || s == "unknown" || s == "unavailable" || s == "none" || s.rfind("initializ", 0) == 0 || s.rfind("initialis", 0) == 0;
          const auto color = initializing
              ? lv_color_hex(0xF59E0B)
              : ((s == "off") ? lv_color_hex(0x9AA3AF) : lv_color_hex(0x22C55E));
          lv_obj_set_style_text_color(id(label_statut_off), color, LV_PART_MAIN);
      - if:
          condition:
            lambda: |-
              std::string s = x;
              std::transform(s.begin(), s.end(), s.begin(), ::tolower);
              return s.empty() || s == "off" || s == "unavailable" || s == "unknown" || s == "none" || s.rfind("initializ", 0) == 0 || s.rfind("initialis", 0) == 0;
          then:
            - logger.log: "Automatisme : Brosse détectée comme inactive. Lancement des 10s de veille."
            - script.execute: temporisation_ecran
          else:
            - script.stop: temporisation_ecran
            - logger.log: "Automatisme : Brosse active ! Allumage immédiat."
            - light.turn_on:
                id: backlight
                brightness: 100%

  - platform: homeassistant
    id: brosse_mode
    entity_id: sensor.sonicare_hx960x_6d3a_brushing_mode
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_mode
          text: !lambda |-
            std::string mode = x;
            std::transform(mode.begin(), mode.end(), mode.begin(), ::tolower);
            std::replace(mode.begin(), mode.end(), '_', ' ');
            if (mode == "deep clean plus" || mode == "deep clean+") return std::string("Deep Clean+");
            if (mode == "gum health") return std::string("Gum Health");
            return x;

  - platform: homeassistant
    id: brosse_type_tete
    entity_id: sensor.sonicare_hx960x_6d3a_brush_head_type
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_type_tete
          text: !lambda |-
            std::string type = x;
            std::transform(type.begin(), type.end(), type.begin(), ::tolower);
            if (type.empty() || type == "unknown" || type == "unavailable" || type == "none") return std::string("--");
            std::replace(type.begin(), type.end(), '_', ' ');
            if (type == "adaptive clean") return std::string("Clean (C)");
            if (type == "adaptive white") return std::string("White (W)");
            if (type == "adaptive gums") return std::string("Gum Care (G)");
            if (type == "tongue clean") return std::string("TongueCare+");
            if (type == "premium all in one") return std::string("All-in-One (A)");
            if (type == "sensitive") return std::string("Sensitive (S)");
            if (type == "non rfid") return std::string("Non-RFID");
            return x;

  - platform: homeassistant
    id: brosse_intensite
    entity_id: sensor.sonicare_hx960x_6d3a_intensity
    internal: true
    on_value:
      - lvgl.label.update:
          id: label_intensite
          text: !lambda |-
            std::string intensity = x;
            std::transform(intensity.begin(), intensity.end(), intensity.begin(), ::tolower);
            if (intensity.find("low") != std::string::npos || intensity == "1") return std::string("LOW");
            if (intensity.find("medium") != std::string::npos || intensity.find("med") != std::string::npos || intensity == "2") return std::string("MEDIUM");
            if (intensity.find("high") != std::string::npos || intensity == "3") return std::string("HIGH");
            return x;
      - lambda: |-
          std::string intensity = x;
          std::transform(intensity.begin(), intensity.end(), intensity.begin(), ::tolower);
          int level = 0;
          if (intensity.find("low") != std::string::npos || intensity == "1") level = 1;
          else if (intensity.find("medium") != std::string::npos || intensity.find("med") != std::string::npos || intensity == "2") level = 2;
          else if (intensity.find("high") != std::string::npos || intensity == "3") level = 3;
          const auto inactive = lv_color_hex(0x303741);
          const auto active = lv_color_hex(0x4F8CFF);
          lv_obj_set_style_bg_color(id(barre_intensite_1), level >= 1 ? active : inactive, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(barre_intensite_2), level >= 2 ? active : inactive, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(barre_intensite_3), level >= 3 ? active : inactive, LV_PART_MAIN);

binary_sensor:
  - platform: homeassistant
    id: brosse_alerte_pression
    entity_id: binary_sensor.sonicare_hx960x_6d3a_pressure_alert
    internal: true
    on_press:
      - lvgl.widget.hide: barre_pression_blanche
      - lvgl.widget.show: barre_pression_rouge
    on_release:
      - lvgl.widget.show: barre_pression_blanche
      - lvgl.widget.hide: barre_pression_rouge

  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
    name: "Bouton Action Vocal"
    on_press:
      - voice_assistant.start:
    on_release:
      - voice_assistant.stop:

