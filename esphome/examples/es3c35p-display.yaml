# Philips Sonicare bridge with a dashboard on the LCDwiki ES3C35P /
# Freenove FNK0104N (ESP32-S3, 3.5" 480x320 touch display), one toothbrush.
#
# Based on the community config by @bvalat (#47), adapted to the other
# example configs. Not tested by the maintainer. The display driver is
# not in an ESPHome release yet: it comes from ESPHome PR #19011
# (`mipi_spi`, model ES3C35P), see `external_components` below.
#
# The bridge part is the same as in atom-s3.yaml. The dashboard reads the
# brush values back from Home Assistant (`homeassistant` sensors), so the
# brush has to be set up in the integration first. Then set `brush` below
# to the entity prefix of your brush (sensor.<brush>_battery, ...).
#
# The screen turns on while the brush is active and off 10 s after it
# goes off or offline. A tap turns it on for 10 s.
#
# The board also has a speaker, a microphone and an RGB LED. They are not
# needed for the bridge and left out here; bvalat's original config in #47
# shows how to set them up.
substitutions:
  name: es3c35p-sonicare
  friendly_name: "ES3C35P Sonicare Bridge"
  # Entity prefix of your brush in Home Assistant
  brush: sonicare_hx960x_6d3a
  # Second line in the dashboard header
  brush_label: "HX960X  |  6D3A"
  # Display texts, e.g. in French: BATTERIE, PRESSION, TÊTE, INTENSITÉ.
  # The brushing mode names stay in English, as printed on the brush.
  txt_battery: "BATTERY"
  txt_pressure: "PRESSURE"
  txt_head: "HEAD"
  txt_mode: "MODE"
  txt_intensity: "INTENSITY"
  txt_session: "SESSION"
  txt_offline: "OFFLINE"
  txt_initializing: "INITIALIZING..."
  txt_off: "OFF"
  txt_standby: "STANDBY"
  txt_brushing: "BRUSHING"
  txt_paused: "PAUSED"
  txt_charging: "CHARGING"
  txt_low: "LOW"
  txt_medium: "MEDIUM"
  txt_high: "HIGH"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Required on every chip but the original ESP32 for brushes with a rotating
  # address (Series 7100, Sonicare For Kids HX6600): without it the bridge
  # pairs, but loses the brush after the first session. Harmless for brushes
  # with a fixed address. See KNOWN_ISSUES.md, "Brushes with a rotating
  # address stop reconnecting on newer ESP32 chips".
  build_flags:
    - -DCONFIG_BT_BLE_RPA_SUPPORTED=0
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: backlight
            brightness: 100%

# ESP-IDF is required (not Arduino) because Bluedroid's notification limit
# is only configurable via sdkconfig.
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # ESPHome 2026.10.0 defaults to ESP-IDF 5.5.6, which drops the pairing
    # after the first disconnect (see KNOWN_ISSUES.md, "ESP bridge loses
    # pairings with ESP-IDF 5.5.6"). ESPHome warns that this is not the
    # recommended version; that is expected. On ESPHome versions that already
    # ship 5.5.5 the line changes nothing. Keep it until KNOWN_ISSUES.md says
    # the issue is fixed.
    version: 5.5.5
    sdkconfig_options:
      CONFIG_BT_GATTC_MAX_CACHE_CHAR: "80"
      CONFIG_BT_GATTC_NOTIF_REG_MAX: "20"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ES3C35P-Fallback"
    password: !secret fallback_password

captive_portal:

# --- BLE ---

esp32_ble:
  io_capability: none
  max_notifications: 20

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 211ms
    window: 120ms

# --- Philips Sonicare Component (Auto-Discovery — no MAC required) ---
#
# To pair:
#   1. Flash this firmware
#   2. In Home Assistant, add the Philips Sonicare integration → ESP32 Bridge
#   3. Walk through "Pair toothbrush with bridge" — switch on the brush when
#      prompted, the ESP scans, bonds, and finishes setup.

external_components:
  - source:
      type: git
      url: https://github.com/mtheli/philips_sonicare_ble
      ref: master
      path: esphome/components
    components: [philips_sonicare]
    refresh: 0s
  # Display driver with the ES3C35P model, not in an ESPHome release yet.
  # Remove this entry once an ESPHome release includes PR #19011.
  - source: github://pr#19011
    components: [mipi_spi]
    refresh: 1h

philips_sonicare:
  - id: philips_sonicare_ble
    # Optional: pre-fill the HA setup form (one-shot defaults).
    # friendly_name: "My Sonicare"
    # area: "Bathroom"
    on_connect:
      then:
        - logger.log: "Connected to Sonicare"
    on_disconnect:
      then:
        - logger.log: "Disconnected from Sonicare"

# --- Hardware: ES3C35P / FNK0104N ---
# https://www.lcdwiki.com/3.5inch_ESP32-S3_Display
# https://docs.freenove.com/projects/fnk0104/en/latest/fnk0104/codes/MAIN/Freenove_ESP32S3_Display.html
# https://github.com/jlmeredith/ES3C35P

spi:
  - id: lcd_bus
    type: quad
    clk_pin: GPIO12
    data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]

i2c:
  - id: bus_a
    sda: GPIO38
    scl: GPIO39
    frequency: 400kHz

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO41
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    # Switched by the brush activity and by touch, see below
    restore_mode: ALWAYS_OFF

display:
  - platform: mipi_spi
    id: lcd
    spi_id: lcd_bus
    model: ES3C35P
    bus_mode: quad
    cs_pin: GPIO10
    # 80 MHz works too, 40 MHz is more stable
    data_rate: 40MHz

# A tap turns the screen on for 10 s, or off again before that. While the
# brush is active, the screen stays on.
touchscreen:
  - platform: st7123
    id: touch
    i2c_id: bus_a
    address: 0x55
    reset_pin: GPIO48
    display: lcd
    on_touch:
      then:
        - if:
            condition:
              script.is_running: screen_timeout
            then:
              - script.stop: screen_timeout
              - light.turn_off: backlight
            else:
              - if:
                  condition:
                    light.is_off: backlight
                  then:
                    - light.turn_on:
                        id: backlight
                        brightness: 100%
                    - script.execute: screen_timeout

script:
  - id: screen_timeout
    mode: restart
    then:
      - delay: 10s
      - light.turn_off: backlight

button:
  - platform: restart
    name: "Restart"

# --- Bluetooth Proxy (optional) ---
# Uncomment to relay BLE for other devices through this ESP.
#
# bluetooth_proxy:
#   active: true

