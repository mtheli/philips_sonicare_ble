esphome:
  name: esp32-ble-bridge
  friendly_name: "ESP32 BLE Bridge"
  # On ESP32-S3, C3, C6 and other newer chips, uncomment for brushes with a
  # rotating address (Series 7100, Sonicare For Kids HX6600): without it the
  # bridge pairs, but loses the brush after the first session. Not needed on
  # the original ESP32. See KNOWN_ISSUES.md, "Brushes with a rotating address
  # stop reconnecting on newer ESP32 chips".
  # build_flags:
  #   - -DCONFIG_BT_BLE_RPA_SUPPORTED=0

# ESP-IDF is required (not Arduino): only it can raise the Bluetooth limits
# set below. See SETUP.md, "What you should NOT change".
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # ESPHome 2026.10.0 defaults to ESP-IDF 5.5.6, which drops the pairing
    # after the first disconnect (see KNOWN_ISSUES.md, "ESP bridge loses
    # pairings with ESP-IDF 5.5.6"). ESPHome warns that this is not the
    # recommended version; that is expected. On ESPHome versions that already
    # ship 5.5.5 the line changes nothing. Keep it until KNOWN_ISSUES.md says
    # the issue is fixed.
    version: 5.5.5
    sdkconfig_options:
      # Services and characteristics per brush (default 40 is too few).
      CONFIG_BT_GATTC_MAX_CACHE_CHAR: "80"
      # Notification slots: 11 per brush plus headroom. Matched to
      # max_notifications under esp32_ble.
      CONFIG_BT_GATTC_NOTIF_REG_MAX: "20"
      # Optional, faster reconnects: see README.md, "Persisted GATT cache".
      # CONFIG_BT_GATTC_CACHE_NVS_FLASH: "y"

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESP32-BLE-Bridge-Fallback"
    password: !secret fallback_password

captive_portal:

# --- BLE ---

esp32_ble:
  io_capability: none
  max_notifications: 20

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 211ms
    window: 120ms

# --- Philips Sonicare Component (Auto-Discovery — no MAC required) ---
#
# The component scans for the Sonicare service UUID, bonds with the brush
# you put into pair-mode via the HA setup flow, and stores the bond identity
# in NVS.  After bonding, the bridge follows the brush's rotating BLE address
# (RPA) through the bond — no MAC pinning needed.
#
# To pair:
#   1. Flash this firmware
#   2. In Home Assistant, add the Philips Sonicare integration → ESP32 Bridge
#   3. Walk through "Pair toothbrush with bridge" — switch on the brush when
#      prompted, the ESP scans, bonds, and finishes setup.
#
# BLE bonding is handled automatically. Models that require bonding (e.g.
# Prestige 9900, ExpertClean, HX991M) are paired via SMP after service
# discovery; models with open GATT (e.g. DiamondClean Smart HX992X) work
# without pairing.

external_components:
  - source:
      type: git
      url: https://github.com/mtheli/philips_sonicare_ble
      ref: master
      path: esphome/components
    components: [philips_sonicare]
    refresh: 0s                  # always fetch latest code on build

philips_sonicare:
  - id: philips_sonicare_ble
    # Optional: pre-fill the HA setup form. `friendly_name` becomes the
    # default device name; `area` auto-assigns the brush to an HA area on
    # first install. One-shot defaults — edit names in HA after that.
    # friendly_name: "My Sonicare"
    # area: "Bathroom"
    on_connect:
      then:
        - logger.log: "Connected to Sonicare"
    on_disconnect:
      then:
        - logger.log: "Disconnected from Sonicare"

# --- Optional: Status LED ---
# Uncomment and adjust GPIO for your board if you want a status indicator.
#
# For boards with a built-in LED (e.g. GPIO2 on many DevKit boards):
# light:
#   - platform: binary
#     output: status_led_output
#     id: status_led
#     name: "Status LED"
#
# output:
#   - platform: gpio
#     id: status_led_output
#     pin: GPIO2

# --- Bluetooth Proxy (optional) ---
# Uncomment to relay BLE for other devices through this ESP.
#
# bluetooth_proxy:
#   active: true
