read_characteristic:
  name: Read characteristic
  description: Read a BLE characteristic from the Sonicare toothbrush (debug).
  fields:
    characteristic_uuid:
      name: Characteristic UUID
      description: The UUID of the characteristic to read.
      required: true
      example: "477ea600-a260-11e4-ae37-0002a5d54120"
      selector:
        text:

write_characteristic:
  name: Write characteristic
  description: Write data to a BLE characteristic on the Sonicare toothbrush (debug).
  fields:
    characteristic_uuid:
      name: Characteristic UUID
      description: The UUID of the characteristic to write.
      required: true
      selector:
        text:
    data:
      name: Data
      description: Hex data to write (e.g. "01" or "0100").
      required: true
      selector:
        text:

force_wake:
  name: Force wake
  description: >
    Manually trigger the wake / reconnect path (debug). Useful on stock
    bluetooth_proxy setups without a parallel local Bluetooth adapter,
    where the D-Bus RSSI fallback can't fire and habluetooth deduplicates
    the brush's static advertisements.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional — only needed when more than one Sonicare entry exists.
      required: false
      selector:
        text:

capture_gatt:
  name: Capture GATT table
  description: >
    Captures the brush's full GATT table (services, characteristics,
    properties, handles) and the value of every readable characteristic
    through the ESP bridge. Handles need bridge firmware 1.16.0 or newer.
    MAC address, serial number, system ID and brush head serial are replaced,
    also where they turn up in other values; stored usage data (session
    history, counters) stays in. It also reads characteristics the
    integration does not use. The result is returned and saved as a JSON
    file in the Home Assistant config folder, ready to attach to a GitHub
    issue. On a brush that is not paired, a characteristic that needs
    encryption can make the bridge start pairing.
  fields:
    entry_id:
      name: Config entry ID
      description: >
        Optional. Without it, the first entry that runs over an ESP bridge is
        used, a connected one first; the response names the entry it used.
      required: false
      selector:
        text:
